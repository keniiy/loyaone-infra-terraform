name: terraform

on:
  pull_request:
    paths: ["**/*.tf", "**/*.tfvars.example", ".tflint.hcl", ".github/workflows/terraform.yml"]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt, validate, tflint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - global/s3-backend
          - global/kms
          - global/ecr
          - environments/dev
          - environments/staging
          - environments/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: fmt
        run: terraform fmt -check -recursive -diff

      - name: init (no backend)
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false

      - name: validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: tflint
        working-directory: ${{ matrix.dir }}
        run: |
          tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"
          tflint --config="${GITHUB_WORKSPACE}/.tflint.hcl" --format=compact

  security:
    name: trivy (iac misconfiguration scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  plan:
    name: plan (${{ matrix.env }})
    if: github.event_name == 'pull_request'
    needs: [lint, security]
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: eu-west-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: plan
        id: plan
        working-directory: environments/${{ matrix.env }}
        env:
          TF_VAR_certificate_arn: ${{ vars.CERTIFICATE_ARN }}
          TF_VAR_github_oidc_provider_arn: ${{ vars.GITHUB_OIDC_PROVIDER_ARN }}
          TF_VAR_alarm_emails: ${{ vars.ALARM_EMAILS }}
          TF_VAR_services: ${{ vars.SERVICES }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock=false -out=tfplan | tee plan.txt

      - name: comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/${{ matrix.env }}/plan.txt', 'utf8');
            const tail = plan.length > 60000 ? plan.slice(-60000) : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### terraform plan: ${{ matrix.env }}\n\n<details><summary>show</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n</details>`
            });
